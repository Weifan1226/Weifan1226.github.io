# =============================================================
#  站点配置 —— 日常更新只需要动这一块
#  改完 _config.yml 后，本地预览服务必须重启才会生效
#  完整维护说明见 README.md
# =============================================================

# 【1/3】站点地址、标题、一句话简介、GitHub 仓库名
url                         : "https://weifan1226.github.io"   # 供 sitemap / RSS / SEO 使用
title                       : "Fanjunduo Wei"
description                 : "NLP | LLM Agent | RL"
repository                  : "Weifan1226/Weifan1226.github.io"

# 【2/3】左侧个人信息栏
# 规则：留空 = 该图标不显示；新增链接只需按 "字段名: 值" 加一行
# 可用字段名见 _includes/author-profile.html
author:
  name                      : "Fanjunduo Wei"
  avatar                    : "images/avatar.png"      # 换头像见 README
  bio                       : "Master Student @ Zhejiang University"
  location                  : "Hangzhou, China"
  employer                  :
  email                     : "weifanjunduo@gmail.com"
  uri                       :
  github                    : "Weifan1226"
  linkedin                  : "fanjunduo-wei-157403330"
  googlescholar             : "https://scholar.google.com/citations?user=vE9fU9gAAAAJ&hl"
  # 其他可选：twitter / orcid / dblp / researchgate / pubmed / weibo / zhihu 等

# 【3/3】可选服务，留空即关闭
google_analytics_id         :
google_site_verification    :
bing_site_verification      :
baidu_site_verification     :
google_scholar_stats_use_cdn : true   # Google Scholar 引用数走 CDN，国内可访问（有缓存延迟）

# =============================================================
#  Jekyll 构建设置 —— 一般不用改
# =============================================================
include:
  - .htaccess
  - _pages
  - files
exclude:
  - google_scholar_crawler
  - .github
  - .workbuddy
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - "*.sublime-project"
  - "*.sublime-workspace"
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development
